<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Begena · በገና</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#1a1008;--gold:#c9922a;--gold2:#e8b84b;--cream:#f5e8c8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--cream);min-height:100vh;display:flex;flex-direction:column;align-items:center;
font-family:Georgia,'Times New Roman',serif;-webkit-user-select:none;user-select:none;overflow-x:hidden;padding-bottom:24px}
h1{font-size:28px;margin-top:18px;letter-spacing:1px}h1 span{color:var(--gold2)}
.am{color:var(--gold);font-size:13px;letter-spacing:3px;margin-top:14px;text-align:center}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 12px 0}
.bar button{background:rgba(255,255,255,.06);border:1px solid rgba(201,146,42,.4);color:var(--gold);font:13px Georgia,serif;
padding:9px 14px;border-radius:3px;cursor:pointer}
.bar button.on{background:var(--gold);color:#2c1505;font-weight:700}
svg{width:min(400px,94vw);height:auto;margin-top:12px;touch-action:none;filter:drop-shadow(0 16px 40px rgba(0,0,0,.7))}
.drone{opacity:.35}.hit{stroke:transparent;stroke-width:26;stroke-linecap:round}
.ln{stroke-linecap:round}.main .ln{stroke:#e8c97a}.drone .ln{stroke:#b89a64}
.on .ln{stroke:#fff3c4;stroke-width:3.2;animation:w .07s 8 alternate}
@keyframes w{to{transform:translateX(2px)}}
.bd{fill:#c9922a;stroke:#2c1505}.fn{fill:#2c1505;font:700 13px Georgia;text-anchor:middle}
.nt{fill:#f5e8c8;font:13px Georgia;text-anchor:middle}
#info{height:22px;margin-top:10px;font-size:15px;color:var(--gold2)}
.ft{font-size:12px;font-style:italic;opacity:.45;text-align:center;margin:8px 20px 0;line-height:1.5}
.rcbar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:14px}
.rcbar button{background:rgba(255,255,255,.06);border:1px solid rgba(201,146,42,.4);color:var(--gold);font:13px Georgia,serif;padding:8px 12px;border-radius:3px;cursor:pointer}
.rcbar button:active{background:var(--gold);color:#2c1505}
.rcbar button.on{background:#a8321c;border-color:#e0553a;color:#ffe9e0;font-weight:700}
#score{width:min(400px,94vw);min-height:76px;box-sizing:border-box;margin-top:10px;padding:9px 12px;border:1px solid rgba(201,146,42,.35);border-radius:4px;background:rgba(255,255,255,.05);font:700 18px Georgia,serif;line-height:1.5;color:var(--cream);outline:none;white-space:pre-wrap;word-break:break-word}
#score:focus{border-color:var(--gold2)}
#score:empty::before{content:attr(data-ph);color:rgba(245,232,200,.3);font:italic 13px Georgia,serif;letter-spacing:0}
#score .hl-on{color:#39e6c8;text-shadow:0 0 9px rgba(57,230,200,.6)}
#rprog{min-height:16px;margin-top:6px;font-size:12px;color:var(--gold2);letter-spacing:1px;text-align:center}
.rcbar label{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(201,146,42,.4);color:var(--gold);font:13px Georgia,serif;padding:8px 12px;border-radius:3px;cursor:pointer}
.rcbar label:active{background:var(--gold);color:#2c1505}
#spd{width:104px;padding:0;background:none;border:none;accent-color:#c9922a;cursor:pointer}
#spdv{color:var(--gold2);font:12px 'Courier New',monospace;min-width:46px;text-align:right}
</style>
</head>
<body>
<div class="am">በገና • BEGENA</div>
<h1>The <span>Begena</span></h1>
<div class="bar" id="bar"></div>
<svg id="sv" viewBox="0 0 340 620">
<defs>
<linearGradient id="wl" x1="0" x2="1"><stop offset="0" stop-color="#1a0a02"/><stop offset=".5" stop-color="#7a3c14"/><stop offset="1" stop-color="#3b1a06"/></linearGradient>
<radialGradient id="lg" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#b04820"/><stop offset=".6" stop-color="#8a3010"/><stop offset="1" stop-color="#4a1805"/></radialGradient>
</defs>
<rect x="38" y="62" width="26" height="470" rx="4" fill="url(#wl)"/>
<rect x="276" y="62" width="26" height="470" rx="4" fill="url(#wl)"/>
<rect x="32" y="62" width="276" height="18" rx="4" fill="#8b4a1e"/>
<rect x="68" y="430" width="204" height="172" rx="8" fill="url(#lg)" stroke="#2a0e02" stroke-width="3"/>
<rect x="72" y="434" width="196" height="164" rx="5" fill="none" stroke="rgba(180,90,30,.45)" stroke-dasharray="4 3"/>
<rect x="125" y="500" width="90" height="12" rx="3" fill="#2c1505"/>
<rect x="118" y="580" width="104" height="14" rx="3" fill="#c8a060"/>
<g id="strings"></g>
</svg>
<div id="info">Tap or slide across the gold strings</div>
<div class="rcbar">
<button id="rec">● Start recording</button>
<button id="rp">▶ Replay</button>
</div>
<div class="rcbar">
<label class="imp">♪ Import audio<input id="afile" type="file" accept="audio/*" hidden></label>
<label class="spd">Speed<input id="spd" type="range" min="0.4" max="2" step="0.05" value="1" aria-label="Playback speed"><span id="spdv">1.00×</span></label>
</div>
<div id="score" contenteditable="true" role="textbox" aria-multiline="true" spellcheck="false" data-ph="Press ● Start recording, then play 1–5 — or type notes here (space = gap, Enter = new line)"></div>
<div id="rprog"></div>
<div class="ft">Gold strings 1·4·6·8·10 are played with fingers 1–5.<br>Press ● Start recording to capture your playing; press ■ Stop to play freely without recording.<br>Edit the score or import an audio recording to transcribe it.</div>
<script>
const NOTE={F2:'bf2',C2:'bc2',D2:'bd2',A2:'ba2',G2:'bg2',E2:'be2',Db2:'bcs2',Gb2:'bfs2'};
const FREQ={F2:87.31,C2:65.41,D2:73.42,A2:110,G2:98,E2:82.41,Db2:69.3,Gb2:92.5};
const K={selamta:['F2','C2','D2','A2','G2'],wanen:['E2','C2','D2','A2','G2'],anchi:['F2','C2','Db2','A2','Gb2']};
const NAMES={selamta:'Selamta',wanen:'Wanen (Tizita)',anchi:'Anchi Hoye'};
const MAIN=[0,3,5,7,9];
let ctx,bufs={},cur='selamta',last=-1,down=false;
const $=id=>document.getElementById(id),lab=n=>n.replace('b','♭');

function initAudio(){
  if(ctx){if(ctx.state!=='running')ctx.resume();return;}
  const AC=window.AudioContext||window.webkitAudioContext;
  ctx=new AC();
  ctx.resume();
  const o=ctx.createBufferSource();
  o.buffer=ctx.createBuffer(1,1,22050);
  o.connect(ctx.destination);
  o.start(0);
  Object.values(NOTE).forEach(k=>fetch('samples/'+k+'.mp3').then(r=>r.arrayBuffer()).then(a=>ctx.decodeAudioData(a,b=>{bufs[k]=b},()=>{})).catch(()=>{}));
}

function play(n){
  const b=bufs[NOTE[n]]; if(!b) return false;
  const s=ctx.createBufferSource(),g=ctx.createGain();
  s.buffer=b; g.gain.value=.9; s.connect(g); g.connect(ctx.destination); s.start(0);
  return true;
}

function draw(){
  let h='';
  for(let i=0;i<10;i++){
    const t=i/9,x1=70+t*200,x2=145+t*50,m=MAIN.indexOf(i),k=m>=0;
    h+=`<g data-s="${i}" class="${k?'main':'drone'}"><line class="hit" x1="${x1}" y1="80" x2="${x2}" y2="584"/>`+
       `<line class="ln" x1="${x1}" y1="80" x2="${x2}" y2="584" stroke-width="${k?2.2:1.2}"/></g>`;
    if(k) h+=`<circle class="bd" cx="${x1}" cy="22" r="12"/><text class="fn" x="${x1}" y="27">${m+1}</text><text class="nt" x="${x1}" y="52">${lab(K[cur][m])}</text>`;
  }
  $('strings').innerHTML=h;
}

function pluck(i,g){
  const m=MAIN.indexOf(i); if(m<0) return;
  const n=K[cur][m],ok=play(n);
  g.classList.remove('on'); g.getBoundingClientRect(); g.classList.add('on'); setTimeout(()=>g.classList.remove('on'),700);
  $('info').textContent=ok?`${lab(n)} · string ${i+1} · finger ${m+1}`:'Loading sounds…';
}

function hit(e){
  const el=document.elementFromPoint(e.clientX,e.clientY),g=el&&el.closest?el.closest('[data-s]'):null,i=g?+g.dataset.s:-1;
  if(i===last) return; last=i; if(i>=0){pluck(i,g); appendNote(MAIN.indexOf(i)+1);}
}

const sv=$('sv');
sv.addEventListener('pointerdown',e=>{e.preventDefault(); initAudio(); down=true; last=-1; hit(e);});
sv.addEventListener('pointermove',e=>{if(down) hit(e);});
['pointerup','pointercancel'].forEach(t=>addEventListener(t,()=>{down=false; last=-1;}));

let recArmed=false,replaying=false,tempo=1,rpTimer=null,rpGen=0;
const SCORE=$('score');

function scoreText(){
  let out='';
  (function walk(n){
    for(const c of n.childNodes){
      if(c.nodeType===3) out+=c.data;
      else if(c.nodeName==='BR') out+='\n';
      else walk(c);
    }
  })(SCORE);
  return out.replace(/\u00a0/g,'');
}

function caretOffset(){
  const sel=getSelection();
  if(!sel||!sel.rangeCount) return -1;
  const n=sel.anchorNode;
  if(!n||!SCORE.contains(n)) return -1;
  const r=document.createRange();
  r.setStart(SCORE,0); r.setEnd(n,sel.anchorOffset);
  return r.toString().length;
}

function setCaretOffset(i){
  const sel=getSelection();
  if(!sel) return;
  const r=document.createRange();
  let total=0, node=null;
  const walk=(n)=>{
    for(const c of n.childNodes){
      if(node) return;
      if(c.nodeType===3){
        const len=c.data.length;
        if(total+len>=i){
          node=c; r.setStart(c,Math.max(0,i-total)); r.setEnd(c,Math.max(0,i-total));
          return;
        }
        total+=len;
      } else {
        if(c.nodeName==='BR'){ if(total>=i){ node=c; r.setStartAfter(c); r.setEndAfter(c); return; } total++; }
        else walk(c);
        if(node) return;
      }
    }
  };
  walk(SCORE);
  if(!node){
    r.selectNodeContents(SCORE);
    r.collapse(false);
  }
  sel.removeAllRanges();
  sel.addRange(r);
}

function insertNewline(){
  const s=scoreText();
  let off=caretOffset();
  if(off<0) off=s.length;
  SCORE.textContent=s.slice(0,off)+'\n'+s.slice(off);
  setCaretOffset(off+1);
}

function normalizeScore(){
  const raw=scoreText(), clean=raw.replace(/[^1-5 \n]/g,'');
  if(clean===raw) return;
  const off=caretOffset();
  SCORE.textContent=clean;
  setCaretOffset(off<0?clean.length:off);
}

function updateRecUI(){
  const b=$('rec');
  b.textContent=recArmed?'■ Stop recording':'● Start recording';
  b.classList.toggle('on',recArmed);
}

function caretIfFocused(){
  if(document.activeElement===SCORE) setCaretOffset(SCORE.textContent.length);
}

function appendNote(n){
  if(!recArmed||replaying||!(n>=1&&n<=5)) return;
  SCORE.textContent=scoreText()+n;
  caretIfFocused();
}

function undo(){
  if(replaying) return;
  const t=scoreText();
  SCORE.textContent=t.slice(0,-1);
  caretIfFocused();
}

function parseScore(str,offset){
  const items=[];
  for(let k=0;k<str.length;k++){
    const c=str[k];
    if(c>='1'&&c<='5') items.push({t:'n',n:+c,ms:300/tempo,i:offset+k});
    else if(c===' ') items.push({t:'r',ms:180/tempo,i:offset+k});
    else if(c==='\n') items.push({t:'r',ms:320/tempo,i:offset+k});
  }
  return items;
}

function locateChar(i){
  let acc=0, res=null;
  (function walk(n){
    for(const c of n.childNodes){
      if(res) return;
      if(c.nodeType===3){
        if(i<acc+c.data.length){res={node:c,off:i-acc}; return;}
        acc+=c.data.length;
      } else {
        walk(c);
      }
    }
  })(SCORE);
  return res;
}

function clearHl(){
  const s=SCORE.querySelector('.hl-on');
  if(s){ s.replaceWith(document.createTextNode(s.textContent)); SCORE.normalize(); }
}

function showHl(i){
  const p=locateChar(i); if(!p) return;
  const r=document.createRange();
  r.setStart(p.node,p.off); r.setEnd(p.node,p.off+1);
  const s=document.createElement('span');
  s.className='hl-on';
  try{ r.surroundContents(s); }catch{ const text=document.createTextNode(p.node.data[p.off]); r.deleteContents(); r.insertNode(s); s.appendChild(text); }
}

function updateReplayUI(){
  const b=$('rp');
  b.textContent=replaying?'■ Stop':'▶ Replay';
  b.classList.toggle('on',replaying);
}

function stopReplay(){
  if(!replaying) return;
  rpGen++; clearTimeout(rpTimer); replaying=false; clearHl(); setStatus(''); updateReplayUI();
}

function replay(){
  if(replaying){stopReplay(); return;}
  const s=scoreText();
  let start=caretOffset(); if(start<0) start=0; if(start>s.length) start=s.length;
  let items=parseScore(s.slice(start),start);
  if(!items.length){ start=0; items=parseScore(s,0); }
  if(!items.length) return;
  initAudio(); replaying=true; updateReplayUI();
  const gen=++rpGen;
  let i=0;
  (function step(){
    if(gen!==rpGen) return;
    if(i>=items.length){
      rpTimer=setTimeout(()=>{ if(gen!==rpGen) return; replaying=false; clearHl(); setStatus(''); updateReplayUI(); },320);
      return;
    }
    const it=items[i];
    rpTimer=setTimeout(()=>{
      if(gen!==rpGen) return;
      if(it.t==='n'){ clearHl(); const gi=MAIN[it.n-1]; pluck(gi,document.querySelector('[data-s="'+gi+'"]')); showHl(it.i); }
      else clearHl();
      setStatus('▶ '+(i+1)+' / '+items.length);
      i++; step();
    }, it.ms);
  })();
}

SCORE.addEventListener('input',normalizeScore);
SCORE.addEventListener('paste',()=>setTimeout(normalizeScore,0));

function setStatus(t){ $('rprog').textContent=t; }

function nearestFinger(f){
  let best=-1,bestD=99;
  for(let i=0;i<K[cur].length;i++){
    const d=Math.abs(12*Math.log2(f/FREQ[K[cur][i]]));
    if(d<bestD){ bestD=d; best=i; }
  }
  return bestD<=0.8?best:-1;
}

function pitchAt(d,sr,start,len){
  if(start<0||start+len>d.length) return -1;
  let mean=0; for(let i=0;i<len;i++) mean+=d[start+i]; mean/=len;
  const x=new Float32Array(len); let r=0;
  for(let i=0;i<len;i++){ const v=d[start+i]-mean; x[i]=v; r+=v*v; }
  if(Math.sqrt(r/len)<0.005) return -1;
  const minLag=Math.floor(sr/200), maxLag=Math.ceil(sr/50);
  let bl=-1, bv=0;
  for(let lag=minLag; lag<=maxLag; lag++){
    let c=0, e1=0, e2=0;
    for(let i=0;i+lag<len;i++){ c+=x[i]*x[i+lag]; e1+=x[i]*x[i]; e2+=x[i+lag]*x[i+lag]; }
    const nc=c/Math.sqrt(e1*e2||1);
    if(nc>bv){ bv=nc; bl=lag; }
  }
  return (bl>0&&bv>=0.6)?sr/bl:-1;
}

async function detectNotes(d,sr){
  const notes=[];
  const frame=1024, hop=256;
  for(let start=0; start+frame<d.length; start+=hop){
    const f=pitchAt(d,sr,start,frame);
    if(f>0){
      const fing=nearestFinger(f);
      if(fing>=0){
        notes.push({t:start/sr,f,fing:fing+1});
      }
    }
  }
  const merged=[];
  for(const n of notes){
    const last=merged[merged.length-1];
    if(last && n.t - last.t < 0.18){
      if(n.f > last.f){ last.f = n.f; last.fing = n.fing; }
    } else {
      merged.push({t:n.t,f:n.f,fing:n.fing});
    }
  }
  return merged;
}

async function importAudio(file){
  setStatus('Decoding audio…');
  try{
    const ab=await file.arrayBuffer();
    initAudio();
    const audio=await ctx.decodeAudioData(ab);
    const lowSR=8000, dur=Math.min(audio.duration,90);
    const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
    const off=new OAC(1,Math.max(1,Math.ceil(dur*lowSR)),lowSR);
    const src=off.createBufferSource();
    src.buffer=audio; src.connect(off.destination); src.start(0);
    const rendered=await off.startRendering();
    const notes=await detectNotes(rendered.getChannelData(0),lowSR);
    if(!notes.length){
      setStatus('No notes detected — try a clearer solo recording.');
      return;
    }
    let out='', prev=null;
    for(const e of notes){
      if(prev!=null){ const gap=e.t-prev; if(gap>1.3) out+='\n'; else if(gap>0.6) out+=' '; }
      out+=e.fing; prev=e.t;
    }
    const prevScore=scoreText();
    SCORE.textContent=(prevScore?prevScore+'\n':'')+out;
    setStatus('♪ '+notes.length+' notes detected · '+NAMES[cur]);
  } catch(err){
    setStatus('Audio import failed — try a WAV or MP3.');
  }
}

const held=new Set();
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const inScore=document.activeElement===SCORE;
  if(inScore){
    if(e.key==='Enter'){ e.preventDefault(); insertNewline(); return; }
    if(!e.repeat && e.key>='1' && e.key<='5' && e.key.length===1){ initAudio(); const gi=MAIN[+e.key-1]; pluck(gi,document.querySelector('[data-s="'+gi+'"]')); }
    return;
  }
  if(e.key==='Enter'){ e.preventDefault(); if(recArmed&&!replaying){ SCORE.textContent=scoreText()+'\n'; caretIfFocused(); } return; }
  if(e.key===' '||e.key==='Spacebar'){ e.preventDefault(); replay(); return; }
  if(e.key==='Backspace'){ e.preventDefault(); undo(); return; }
  const n='12345'.indexOf(e.key); if(n<0 || e.key.length!==1) return;
  e.preventDefault(); if(held.has(n)) return; held.add(n);
  initAudio(); const i=MAIN[n]; pluck(i,document.querySelector('[data-s="'+i+'"]')); appendNote(n+1);
});
addEventListener('keyup',e=>{ const n='12345'.indexOf(e.key); if(n>=0) held.delete(n); });
addEventListener('blur',()=>held.clear());

$('bar').innerHTML=Object.keys(NAMES).map(k=>`<button data-k="${k}" class="${k===cur?'on':''}">${NAMES[k]}</button>`).join('');
$('bar').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return; cur=b.dataset.k;
  document.querySelectorAll('#bar button').forEach(x=>x.classList.toggle('on',x===b));
  draw(); $('info').textContent=NAMES[cur];
});
$('rec').addEventListener('click',()=>{ recArmed=!recArmed; if(recArmed) initAudio(); updateRecUI(); });
$('rp').addEventListener('click',replay);
$('afile').addEventListener('change',e=>{ const f=e.target.files&&e.target.files[0]; e.target.value=''; if(f) importAudio(f); });
$('spd').addEventListener('input',e=>{ tempo=+e.target.value; $('spdv').textContent=tempo.toFixed(2)+'×'; });

updateRecUI();
updateReplayUI();
draw();

</script>
</body>
</html>
